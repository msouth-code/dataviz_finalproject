<!--
    GENRE TRENDS OVER TIME

    This visualization displays Tomatometer rating trends by genre
    over the years using an embedded Flourish interactive chart.

    The chart is hosted externally on Flourish Studio and embedded
    via iframe/script for interactivity.

    Data Source: Flourish visualization #28977713
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Trend Chart - Genre Ratings Over Time</title>
    <script src="https://d3js.org/d3.v7.min.js" charset="utf-8"></script>
</head>

<body>
    <!-- Navigation -->
    <a class="back-button" href="../index.html">Back</a>

    <!-- Page Header -->
    <div class="page-header">
        Explore Trends in Tomatometer Rating by Genre Over the Years!
    </div>
    <p></p>

    <!--
        Flourish Embedded Chart Container
        The chart is responsive and will resize to fit the container.
        Max width is constrained to maintain readability.
    -->
    <div style="max-width: 800px; margin: 0 auto;">
        <div class="flourish-embed flourish-chart" data-src="visualisation/28977713">
            <script src="https://public.flourish.studio/resources/embed.js"></script>
            <!-- Fallback for browsers without JavaScript -->
            <noscript>
                <img src="https://public.flourish.studio/visualisation/28977713/thumbnail"
                     width="100%"
                     alt="Line chart showing Tomatometer rating trends by genre over time">
            </noscript>
        </div>
    </div>

</body>

</html>
