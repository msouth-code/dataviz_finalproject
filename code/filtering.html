<!--
    SCATTERPLOT VISUALIZATION: Critics vs Audience Ratings

    This visualization compares Tomatometer (critics) scores against
    audience ratings, allowing users to filter by genre, studio, and
    MPAA rating to explore patterns in movie reviews.

    Data Source: mini_movieratings.csv
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Scatterplot Chart - Critics vs Audience</title>
    <script src="https://d3js.org/d3.v7.min.js" charset="utf-8"></script>
</head>

<body>
    <!-- Navigation -->
    <a class="back-button" href="../index.html">Back</a>

    <!-- Page Header -->
    <div class="page-header">Do Critics and The Audience Agree?</div>
    <p></p>

    <!-- Chart and Controls Container -->
    <div class="chart-container">
        <div id="my_dataviz"></div>
        <div id="filters"></div>
    </div>

    <script type="text/javascript">
        // =================================================================
        // CONFIGURATION
        // =================================================================

        // Global dataset variable - holds filtered or full data
        var dataset;

        // Chart dimensions with margins for axes and labels
        const margin = { top: 50, right: 30, bottom: 70, left: 60 };
        const width = 760 - margin.left - margin.right;
        const height = 400 - margin.top - margin.bottom;

        // MPAA rating color mapping for visual distinction
        const ratingColorMap = {
            "G": "#2ecc71",        // Green - General audiences
            "PG": "#3498db",       // Blue - Parental guidance
            "PG-13": "#f39c12",    // Orange - Parents cautioned
            "R": "#e74c3c",        // Red - Restricted
            "NC17": "#8f00ff"      // Purple - Adults only
        };

        // Color accessor function with fallback for unknown ratings
        const ratingColor = (rating) => ratingColorMap[rating] || "#7f8c8d";


        // =================================================================
        // SVG SETUP
        // =================================================================

        // Create responsive SVG container with viewBox for scaling
        const svg = d3.select("#my_dataviz")
            .append("svg")
            .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
            .attr("preserveAspectRatio", "xMidYMid meet")
            .append("g")
            .attr("transform", `translate(${margin.left}, ${margin.top})`);


        // =================================================================
        // TOOLTIP SETUP
        // =================================================================

        // Create tooltip div for displaying movie details on hover
        const tooltip = d3.select("body")
            .append("div")
            .attr("class", "tooltip")
            .style("position", "absolute")
            .style("background", "white")
            .style("padding", "5px")
            .style("border", "1px solid #ccc")
            .style("pointer-events", "none")
            .style("opacity", 0);


        // =================================================================
        // DATA LOADING & FILTER SETUP
        // =================================================================

        d3.csv("../data/mini_movieratings.csv").then(function(data) {

            // ---------------------------------------------------------
            // Genre Filter Dropdown
            // ---------------------------------------------------------

            // Extract unique genres from comma-separated genre strings
            const allGenres = [...new Set(
                data.flatMap(d => d.genre.split(", "))
            )].sort();

            const genreDropdown = d3.select("#filters")
                .append("select")
                .attr("id", "genre-filter");

            // Add "All" option as default
            genreDropdown.append("option")
                .attr("value", "All")
                .text("All Genres");

            // Populate with unique genres
            genreDropdown.selectAll("option.genre")
                .data(allGenres)
                .enter()
                .append("option")
                .attr("value", d => d)
                .text(d => d);

            genreDropdown.on("change", applyFilters);

            // ---------------------------------------------------------
            // Studio Filter Dropdown
            // ---------------------------------------------------------

            const allStudios = [...new Set(
                data.flatMap(d => d["studio_name"].split(", "))
            )].sort();

            const studioDropdown = d3.select("#filters")
                .append("select")
                .attr("id", "studio-filter");

            studioDropdown.append("option")
                .attr("value", "All")
                .text("All Studios");

            studioDropdown.selectAll("option.studio")
                .data(allStudios)
                .enter()
                .append("option")
                .attr("value", d => d)
                .text(d => d);

            studioDropdown.on("change", applyFilters);

            // ---------------------------------------------------------
            // MPAA Rating Filter Dropdown
            // ---------------------------------------------------------

            const allRatings = [...new Set(
                data.flatMap(d => d.rating.split(", "))
            )].sort();

            const ratingDropdown = d3.select("#filters")
                .append("select")
                .attr("id", "rating-filter");

            ratingDropdown.append("option")
                .attr("value", "All")
                .text("All Ratings");

            ratingDropdown.selectAll("option.rating")
                .data(allRatings)
                .enter()
                .append("option")
                .attr("value", d => d)
                .text(d => d);

            ratingDropdown.on("change", applyFilters);

            // ---------------------------------------------------------
            // Filter Application Function
            // ---------------------------------------------------------

            /**
             * Applies all active filters and redraws the chart.
             * Filters are combined with AND logic.
             */
            function applyFilters() {
                const selectedGenre = d3.select("#genre-filter").property("value");
                const selectedStudio = d3.select("#studio-filter").property("value");
                const selectedRating = d3.select("#rating-filter").property("value");

                // Filter data based on all selected criteria
                const filtered = data.filter(d => {
                    const genreMatch = selectedGenre === "All" ||
                                       d.genre.split(", ").includes(selectedGenre);
                    const studioMatch = selectedStudio === "All" ||
                                        d["studio_name"] === selectedStudio;
                    const ratingMatch = selectedRating === "All" ||
                                        d["rating"] === selectedRating;
                    return genreMatch && studioMatch && ratingMatch;
                });

                dataset = filtered;
                drawChart();
            }

            // Initial render with full dataset
            dataset = data;
            drawChart();
        });


        // =================================================================
        // CHART DRAWING FUNCTION
        // =================================================================

        /**
         * Draws or redraws the scatterplot based on current dataset.
         * Clears existing elements and creates new ones from scratch.
         */
        function drawChart() {
            // Clear previous chart elements
            svg.selectAll("circle").remove();
            svg.selectAll("g").remove();
            svg.selectAll("text").remove();

            // ---------------------------------------------------------
            // X-Axis: Tomatometer Rating (Critics)
            // ---------------------------------------------------------

            const xMax = d3.max(dataset, d => +d["tomatometer_rating"]);
            const x = d3.scaleLinear()
                .range([0, width])
                .domain([0, xMax]);

            svg.append("g")
                .attr("transform", `translate(0, ${height})`)
                .call(d3.axisBottom(x))
                .selectAll("text")
                .attr("transform", "translate(-10,0)rotate(-45)")
                .style("text-anchor", "end");

            // ---------------------------------------------------------
            // Y-Axis: Audience Rating
            // ---------------------------------------------------------

            const yMax = d3.max(dataset, d => +d["audience_rating"]);
            const y = d3.scaleLinear()
                .domain([0, yMax])
                .range([height, 0]);

            svg.append("g")
                .call(d3.axisLeft(y));

            // ---------------------------------------------------------
            // Data Points (Circles)
            // ---------------------------------------------------------

            svg.selectAll("scatter-dots")
                .data(dataset)
                .enter()
                .append("circle")
                .attr("cx", d => x(d["tomatometer_rating"]))
                .attr("cy", d => y(d["audience_rating"]))
                .attr("r", 3)
                .attr("fill", d => ratingColor(d.rating))
                // Tooltip on hover
                .on("mouseover", (event, d) => {
                    d3.select(event.currentTarget).style("opacity", 1);
                    tooltip
                        .style("opacity", 1)
                        .html(`
                            <strong>Title:</strong> ${d["movie_title"]}<br>
                            <strong>Genre(s):</strong> ${d["genre"]}<br>
                            <strong>Rating:</strong> ${d["rating"]}<br>
                            <strong>Studio:</strong> ${d["studio_name"]}<br>
                            <strong>Tomatometer:</strong> ${d["tomatometer_rating"]}%<br>
                            <strong>Audience:</strong> ${d["audience_rating"]}%
                        `)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 10) + "px");
                })
                .on("mouseout", () => {
                    tooltip.style("opacity", 0);
                });

            // ---------------------------------------------------------
            // Chart Labels
            // ---------------------------------------------------------

            // Chart title
            svg.append("text")
                .attr("text-anchor", "middle")
                .attr("transform", `translate(${width / 2}, ${margin.top - 70})`)
                .text("Tomatometer vs. Audience Ratings");

            // X-axis label
            svg.append("text")
                .attr("text-anchor", "middle")
                .attr("transform", `translate(${width / 2}, ${height + margin.top})`)
                .text("Tomatometer Rating");

            // Y-axis label
            svg.append("text")
                .attr("text-anchor", "middle")
                .attr("transform", "rotate(-90)")
                .attr("y", -margin.left + 20)
                .attr("x", -height / 2)
                .text("Audience Rating");

            // ---------------------------------------------------------
            // Legend
            // ---------------------------------------------------------

            const ratings = ["G", "PG", "PG-13", "R", "NC17"];
            const legendSpacing = 60;
            const legendWidth = (ratings.length - 1) * legendSpacing + 40;

            const legend = svg.append("g")
                .attr("transform", `translate(${(width - legendWidth) / 2}, ${height + margin.bottom - 15})`);

            ratings.forEach((rating, i) => {
                const legendItem = legend.append("g")
                    .attr("transform", `translate(${i * legendSpacing}, 0)`);

                // Color swatch
                legendItem.append("rect")
                    .attr("width", 12)
                    .attr("height", 12)
                    .attr("fill", ratingColor(rating));

                // Rating label
                legendItem.append("text")
                    .attr("x", 16)
                    .attr("y", 10)
                    .attr("font-size", "12px")
                    .text(rating);
            });
        }
    </script>
</body>

</html>
