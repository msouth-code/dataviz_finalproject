<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Director-Actor Collaborations</title>
    <script src="https://d3js.org/d3.v7.min.js" charset="utf-8"></script>
</head>

<body>
    <div class="page" style="width: 100%; max-width: 1360px; margin: 0 auto;">
    <a class="back-button" href="../index.html">Back</a>
    <div class="page-header" style="justify-content: center; align-items: center;">Director-Actor Collaborations</div>
    <p> </p>

    <div class="chart-container">
        <div id="tree-chart"></div>
        <div id="tree-tooltip" style="
            position: fixed;
            display: none;
            background: white;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 14px;
            pointer-events: none;
            font-size: 14px;
            max-width: 300px;
            z-index: 100;
            box-shadow: 0 4px 16px rgba(0,0,0,.2);
        ">
            <div id="tt-title" style="font-weight: bold; margin-bottom: 5px;"></div>
            <div id="tt-movies" style="color: #333;"></div>
        </div>
    </div>

    <script type="text/javascript">
        const margin = { top: 40, right: 200, bottom: 40, left: 150 };
        const width = 1400 - margin.left - margin.right;
        const height = 800 - margin.top - margin.bottom;

        const svg = d3.select("#tree-chart")
            .append("svg")
            .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
            .attr("preserveAspectRatio", "xMidYMid meet")
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const tooltip = document.getElementById('tree-tooltip');
        const ttTitle = document.getElementById('tt-title');
        const ttMovies = document.getElementById('tt-movies');

        d3.csv("../data/directors.csv").then(function(data) {
            console.log("Data loaded:", data.length, "movies");

            // Build a map of director -> actor -> { count, movies }
            const directorActorMap = {};
            // Also track all movies per director
            const directorMovies = {};

            data.forEach(movie => {
                const directors = movie.directors.split(", ");
                const cast = movie.cast.split(", ");
                const title = movie.movie_title;

                directors.forEach(director => {
                    // Track director's movies
                    if (!directorMovies[director]) {
                        directorMovies[director] = [];
                    }
                    if (!directorMovies[director].includes(title)) {
                        directorMovies[director].push(title);
                    }

                    // Track director-actor collaborations
                    if (!directorActorMap[director]) {
                        directorActorMap[director] = {};
                    }
                    cast.forEach(actor => {
                        if (!directorActorMap[director][actor]) {
                            directorActorMap[director][actor] = { count: 0, movies: [] };
                        }
                        directorActorMap[director][actor].count += 1;
                        if (!directorActorMap[director][actor].movies.includes(title)) {
                            directorActorMap[director][actor].movies.push(title);
                        }
                    });
                });
            });

            // Convert to hierarchy, filtering for actors in 4+ movies with same director
            const hierarchyData = {
                name: "Directors",
                children: Object.entries(directorActorMap)
                    .map(([director, actors]) => ({
                        name: director,
                        movies: directorMovies[director] || [],
                        children: Object.entries(actors)
                            .filter(([actor, info]) => info.count >= 4)
                            .map(([actor, info]) => ({
                                name: actor,
                                value: info.count,
                                movies: info.movies,
                                director: director
                            }))
                            .sort((a, b) => b.value - a.value)
                            .slice(0, 10)  // limit to top 10 actors per director
                    }))
                    .filter(d => d.children.length > 0)
                    .sort((a, b) => b.children.length - a.children.length)
            };

            console.log("Directors with repeat actors:", hierarchyData.children.length);
            console.log(hierarchyData);

            // Create the tree layout
            const root = d3.hierarchy(hierarchyData);

            const treeLayout = d3.tree()
                .size([height, width - 100]);

            treeLayout(root);

            // Draw links
            svg.selectAll(".link")
                .data(root.links())
                .enter()
                .append("path")
                .attr("class", "link")
                .attr("fill", "none")
                .attr("stroke", "#ccc")
                .attr("stroke-width", 2)
                .attr("d", d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x));

            // Draw nodes
            const nodes = svg.selectAll(".node")
                .data(root.descendants())
                .enter()
                .append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.y},${d.x})`);

            // Add circles for nodes
            nodes.append("circle")
                .attr("r", d => d.depth === 0 ? 12 : d.depth === 1 ? 8 : 5)
                .attr("fill", d => {
                    if (d.depth === 0) return "#ff6b6b";  // root
                    if (d.depth === 1) return "#4ecdc4";  // directors
                    return "#ffe66d";  // actors
                })
                .attr("stroke", "#333")
                .attr("stroke-width", 1);

            // Add labels
            nodes.append("text")
                .attr("dy", "0.35em")
                .attr("x", d => d.children ? -15 : 10)
                .attr("text-anchor", d => d.children ? "end" : "start")
                .attr("fill", "black")
                .attr("font-size", "20px")
                .text(d => {
                    if (d.data.value) {
                        return `${d.data.name} (${d.data.value})`;
                    }
                    return d.data.name;
                });

            // Add tooltip events
            nodes.on("mouseover", function(event, d) {
                if (d.depth === 0) return; // Skip root node

                if (d.depth === 1) {
                    // Director node - show all movies by this director
                    ttTitle.textContent = d.data.name + " - Movies:";
                    const movies = d.data.movies || [];
                    ttMovies.innerHTML = movies.length > 0 ? "• " + movies.join("<br>• ") : "No movies found";
                } else if (d.depth === 2) {
                    // Actor node - show movies with this actor by the parent director
                    const director = d.parent.data.name;
                    ttTitle.textContent = d.data.name + " with " + director + ":";
                    const movies = d.data.movies || [];
                    ttMovies.innerHTML = movies.length > 0 ? "• " + movies.join("<br>• ") : "No movies found";
                }

                tooltip.style.display = "block";

                // Position tooltip, keeping it on screen
                const ttWidth = tooltip.offsetWidth;
                const ttHeight = tooltip.offsetHeight;
                const viewWidth = window.innerWidth;
                const viewHeight = window.innerHeight;

                let left = event.clientX + 15;
                let top = event.clientY - 10;

                // Prevent right overflow
                if (left + ttWidth > viewWidth - 10) {
                    left = event.clientX - ttWidth - 15;
                }
                // Prevent bottom overflow
                if (top + ttHeight > viewHeight - 10) {
                    top = viewHeight - ttHeight - 10;
                }
                // Prevent top overflow
                if (top < 10) {
                    top = 10;
                }

                tooltip.style.left = left + "px";
                tooltip.style.top = top + "px";
            })
            .on("mousemove", function(event) {
                const ttWidth = tooltip.offsetWidth;
                const ttHeight = tooltip.offsetHeight;
                const viewWidth = window.innerWidth;
                const viewHeight = window.innerHeight;

                let left = event.clientX + 15;
                let top = event.clientY - 10;

                if (left + ttWidth > viewWidth - 10) {
                    left = event.clientX - ttWidth - 15;
                }
                if (top + ttHeight > viewHeight - 10) {
                    top = viewHeight - ttHeight - 10;
                }
                if (top < 10) {
                    top = 10;
                }

                tooltip.style.left = left + "px";
                tooltip.style.top = top + "px";
            })
            .on("mouseout", function() {
                tooltip.style.display = "none";
            });

        }).catch(function(error) {
            console.error("Error loading CSV:", error);
        });
    </script>
    </div>
</body>

</html>
